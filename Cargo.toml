# Yokai workspace.
#
# Every member is listed explicitly, so a stray directory under crates/ is not a workspace member.
[workspace]
resolver = "3"
members = [
    "crates/yokai-exec",
    "crates/yokai-ipc",
    "crates/yokai-platform",
    "crates/yokai-store",
    "crates/yokai-supervisor",
    "crates/yokai-testsupport",
    "crates/yokai-types",
    "crates/yokai-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
yokai-testsupport = { path = "crates/yokai-testsupport" }
getrandom = { version = "=0.4.3", default-features = false }
yokai-platform = { path = "crates/yokai-platform" }
yokai-types = { path = "crates/yokai-types" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
