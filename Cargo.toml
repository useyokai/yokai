# Yokai workspace.
#
# Every member is listed explicitly, so a stray directory under crates/ never becomes part of
# the build. Only `yokai-store` depends on an external crate.
[workspace]
resolver = "3"
members = [
    "crates/yokai-exec",
    "crates/yokai-ipc",
    "crates/yokai-platform",
    "crates/yokai-store",
    "crates/yokai-supervisor",
    "crates/yokai-testsupport",
    "crates/yokai-types",
    "crates/yokai-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Exact version and explicit features. `bundled` compiles the SQLite amalgamation shipped with
# libsqlite3-sys, so the SQLite release does not depend on the host; `cache` keeps the prepared
# statement cache. Default features are off so that no WebAssembly-only dependency is enabled.
# `load_extension` must never be enabled.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
yokai-testsupport = { path = "crates/yokai-testsupport" }

# Use stack unwinding rather than aborting on panic.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
