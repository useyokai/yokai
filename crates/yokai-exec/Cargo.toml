[package]
name = "yokai-exec"
description = "Boundary between durable execution records and the agent execution engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
test = false
doctest = false

[dependencies]
yokai-store = { path = "../yokai-store" }
yokai-types.workspace = true

[dev-dependencies]
yokai-testsupport.workspace = true

[features]
test-api = ["yokai-store/test-api"]

[[test]]
name = "conversation_runtime"
path = "tests/conversation_runtime.rs"
harness = false
required-features = ["test-api"]

[[example]]
name = "conversation_core"
path = "examples/conversation_core.rs"
