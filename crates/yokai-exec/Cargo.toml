[package]
name = "yokai-exec"
description = "Boundary between durable execution records and the agent execution engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
test = true
doctest = false

[dependencies]
yokai-ipc = { path = "../yokai-ipc" }
yokai-platform.workspace = true
yokai-store = { path = "../yokai-store" }
yokai-types.workspace = true

[dev-dependencies]
yokai-testsupport.workspace = true

[features]
test-api = ["yokai-store/test-api", "yokai-ipc/test-api", "yokai-platform/test-api"]

[[bin]]
name = "yokai-runtime"
path = "src/bin/yokai-runtime.rs"

[[test]]
name = "local_runtime_windows"
path = "tests/local_runtime_windows.rs"
harness = false
required-features = ["test-api"]

[[test]]
name = "conversation_runtime"
path = "tests/conversation_runtime.rs"
harness = false
required-features = ["test-api"]

[[example]]
name = "conversation_core"
path = "examples/conversation_core.rs"
