[package]
name = "yokai-store"
description = "Local storage: one SQLite database file per Instance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
test = false
doctest = false

[dependencies]
sha2.workspace = true
rusqlite.workspace = true
yokai-platform.workspace = true
yokai-types.workspace = true

[dev-dependencies]
yokai-testsupport.workspace = true

[features]
test-api = ["yokai-platform/test-api"]

[[test]]
name = "sqlite_runtime"
path = "tests/sqlite_runtime.rs"
harness = false
required-features = ["test-api"]

[[test]]
name = "instance_lifecycle"
path = "tests/instance_lifecycle.rs"
harness = false
required-features = ["test-api"]

[[test]]
name = "store_runtime"
path = "tests/store_runtime.rs"
harness = false
required-features = ["test-api"]

[[test]]
name = "instance_migrations"
path = "tests/instance_migrations.rs"
harness = false
required-features = ["test-api"]

[[test]]
name = "durable_primitives"
path = "tests/durable_primitives.rs"
harness = false
required-features = ["test-api"]

[[test]]
name = "windows_validation"
path = "tests/windows_validation.rs"
harness = false
required-features = ["test-api"]
