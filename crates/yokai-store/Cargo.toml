[package]
name = "yokai-store"
description = "Local storage: one SQLite database file per Instance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
test = false
doctest = false

[dependencies]
rusqlite.workspace = true
yokai-platform.workspace = true
yokai-types.workspace = true

[dev-dependencies]
yokai-testsupport.workspace = true

[features]
test-api = ["yokai-platform/test-api"]

[[test]]
name = "sqlite_runtime"
path = "tests/sqlite_runtime.rs"
harness = false

[[test]]
name = "instance_lifecycle"
path = "tests/instance_lifecycle.rs"
harness = false
required-features = ["test-api"]
